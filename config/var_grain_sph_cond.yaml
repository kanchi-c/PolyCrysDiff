dataset_params:
  im_path: 'data/var_sph'
  im_channels : 3
  im_size : 64
  name: 'poly'

diffusion_params:
  num_timesteps : 1000
  beta_start : 0.0015
  beta_end : 0.0195
  sample_save_steps: 50

ldm_params:
  down_channels: [ 128, 256, 256, 256]
  mid_channels: [ 256, 256]
  down_sample: [ False, False, False ]
  attn_down : [True, True, True]
  time_emb_dim: 256
  norm_channels : 32
  num_heads : 16
  conv_out_channels : 128
  num_down_layers: 2
  num_mid_layers: 2
  num_up_layers: 2
  cross_attn: [False, False, False]

  condition_config:
    condition_types: ['value']
    value_condition_config:
      # context_dim: 64
      len_vector: 2
      keys: ['seeds_num', 'sph']

autoencoder_params:
  z_channels: 3
  codebook_size : 20
  down_channels : [32, 64, 128]
  mid_channels : [128, 128]
  down_sample : [True, True]
  attn_down : [False, False]
  norm_channels: 32
  num_heads: 16
  num_down_layers : 1
  num_mid_layers : 1
  num_up_layers : 1

train_params:
  seed : 1111
  debug : False
  task_name: 'out/var_grain_sph'
  ldm_batch_size: 1
  autoencoder_batch_size: 2
  disc_start: 1000
  disc_weight: 0.5
  codebook_weight: 1
  commitment_beta: 0.2
  perceptual_weight: 1
  kl_weight: 0

  ldm_epochs : 400
  ldm_ckpt_save_epochs: 100
  ldm_lr: 0.00001

  autoencoder_epochs : 400
  autoencoder_ckpt_save_epochs : 100
  autoencoder_acc_steps : 2
  autoencoder_img_save_epochs: 10
  autoencoder_lr: 0.00001

  save_latents : False
  ldm_ckpt_name: 'ddpm_grain_sph_cond_ckpt'
  ldm_ckpt_epoch: 400
  vae_autoencoder_ckpt_name: 'vae_autoencoder_ckpt'
  vae_ckpt_epoch: 400
